# Usage: cp .env.example .env && docker compose up --build
services:
  neo4j:
    image: neo4j:5.15-community
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    environment:
      # NEO4J_PASSWORD must be at least 8 characters. Change it for anything but local dev.
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password}
      - 'NEO4J_PLUGINS=["apoc", "graph-data-science"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./neo4j:/schema:ro
    healthcheck:
      # NEO4J_AUTH is "neo4j/<password>"; strip the user part to get the password
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - HFI_CONFIG=/app/config/config.yaml
    volumes:
      - ./config:/app/config:ro

volumes:
  neo4j_data:
  neo4j_logs:
